composites_lib_unb_ca.settings:
  type: config_object
  label: 'Composites theme settings'
  mapping:
    # Existing schema (the snippet above covers many theme settings).
    # Additional schema entries for the exact config you provided:
    features:
      type: mapping
      label: 'Feature toggles'
      mapping:
        node_user_picture:
          type: integer
          label: 'Node author picture'
          description: '0 = disabled, 1 = enabled'
        comment_user_picture:
          type: integer
          label: 'Comment author picture'
          description: '0 = disabled, 1 = enabled'
        comment_user_verification:
          type: integer
          label: 'Comment user verification'
          description: '0 = disabled, 1 = enabled'
        favicon:
          type: integer
          label: 'Favicon feature toggle'
          description: '0 = disabled, 1 = enabled'

    logo:
      type: mapping
      label: 'Logo settings (compatibility)'
      mapping:
        use_default:
          type: integer
          label: 'Use default logo'
          description: '0 = false, 1 = true (keeps numeric representation from config)'
        path:
          type: text
          label: 'Custom logo path'
          description: 'Path to custom logo file'

    favicon:
      type: mapping
      label: 'Favicon settings (compatibility)'
      mapping:
        use_default:
          type: integer
          label: 'Use default favicon'
          description: '0 = false, 1 = true'
        path:
          type: text
          label: 'Custom favicon path'
          description: 'Path to custom favicon file'

    b4_top_container:
      type: text
      label: 'Top container type'
      description: 'E.g. "container", "container-fluid"'

    b4_body_schema:
      type: text
      label: 'Body schema'
      description: 'Named body schema or "none"'

    b4_body_bg_schema:
      type: text
      label: 'Body background schema'
      description: 'Named background schema or "none"'

    b4_navbar_schema:
      type: text
      label: 'Navbar schema'
      description: 'Named navbar schema (e.g. "dark", "light")'

    b4_navbar_bg_schema:
      type: text
      label: 'Navbar background schema'
      description: 'Named navbar background schema'

    b4_footer_schema:
      type: text
      label: 'Footer schema'
      description: 'Named footer schema or "none"'

    b4_footer_bg_schema:
      type: text
      label: 'Footer background schema'
      description: 'Named footer background schema'

    subtheme_folder:
      type: text
      label: 'Subtheme folder'
      description: 'Filesystem folder used for the subtheme (empty if none)'

    subtheme_name:
      type: text
      label: 'Subtheme human name'
      description: 'Human readable subtheme name'

    subtheme_machine_name:
      type: text
      label: 'Subtheme machine name'
      description: 'Machine name for the subtheme (used for .info.yml, etc.)'
